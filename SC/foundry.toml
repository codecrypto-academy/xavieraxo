[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
localhost = { api_url = "http://localhost:4000/api", key = "TEST" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

